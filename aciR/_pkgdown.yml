# The site is built and deployed to the gh-pages branch by CI. It resolves once
# the repository is public and Pages is enabled on that branch, which is free
# for a public repository. Until the first push the URL below does not resolve.
url: https://biometryhub.github.io/ACI/

template:
  bootstrap: 5

# Everything under `pkgdown/assets/` is copied verbatim into the built site.
# The two ledgers live there rather than in the repository root, because they
# are HTML: GitHub serves them as source, so the rendered site is the only
# place a reader can actually read them.

navbar:
  structure:
    left: [intro, reference, articles, evidence, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Assumptions and interpretation
        href: articles/assumptions.html
      - text: Validation and the independent oracle
        href: articles/validation.html
    evidence:
      text: Evidence
      menu:
      - text: Parity ledger
      - text: The reference and this package side by side, quantity by quantity
        href: ledgers/parity_ledger.html
      - text: ---------
      - text: Development ledger
      - text: How the software came to be, and what remains open
        href: ledgers/development_ledger.html

home:
  title: Assimilative causal inference for conditional Gaussian nonlinear systems
  description: >
    How much the future of an observed signal tells us about the present state
    of something we cannot observe, for systems whose filter and smoother are
    both available in closed form.
  links:
  - text: Parity ledger, the numbers side by side
    href: ledgers/parity_ledger.html
  - text: Development ledger, how it came to be
    href: ledgers/development_ledger.html
  - text: The method's paper in Nature Communications
    href: https://doi.org/10.1038/s41467-026-68568-0
  - text: The authors' reference MATLAB implementation
    href: https://github.com/marandmath/ACI_code

authors:
  Max Moldovan:
    href: https://orcid.org/0000-0001-9680-8474
  Marios Andreou:
    html: Marios Andreou
    href: https://github.com/marandmath

reference:
- title: Model layer
  desc: >
    High-level entry points. Build a conditional Gaussian nonlinear system as a
    model object, simulate a realisation of it, and run the whole assimilative
    causal inference workflow in a single call.
  contents:
  - aci
  - aci_cgns_model
  - aci_dyad_model
  - aci_simulate
- title: Conditional Gaussian core
  desc: >
    The numerical core. The forward filter, the backward smoother and the
    causal-information metric, each written against a general components list so
    they apply to any conditional Gaussian nonlinear system.
  contents:
  - aci_filter
  - aci_smoother
  - aci_metric
- title: Causal influence range
  desc: >
    How far ahead in the observed record the estimate of the unobserved state
    keeps improving, and the fixed-lag online smoother it is built from. These
    answer a different question from the causal-information metric, which
    measures how much the record says rather than how long it takes to say it.
  contents:
  - aci_online_smoother
  - aci_cir
- title: Vector states and conditional questions
  desc: >
    The numerical core takes vector-valued states with matrix coefficients, and
    the conditional construction asks what one observed component says about
    the unobserved state given that the others are also watched.
  contents:
  - aci_conditional
- title: The stochastic ENSO model
  desc: >
    The six-dimensional El Nino Southern Oscillation system of the paper's
    case study. The largest system the package expresses, and the only one
    whose noise covariances vary in time.
  contents:
  - aci_enso_model
  - aci_enso_components
  - aci_enso_parameters
- title: The noisy predator-prey model
  desc: >
    A stochastic Lotka-Volterra pair, studied in either causal direction. It is
    the model whose latent self-drift is set by the observed state, and so the
    one that exercises a self-drift varying in time.
  contents:
  - aci_predprey_model
  - aci_predprey_components
- title: The nonlinear dyad model
  desc: >
    The worked-example dyad model with intermittent extreme events, at the
    components level, and the components schema it illustrates.
  contents:
  - aci_components
  - aci_dyad_components
- title: Methods
  desc: >
    Reporting methods for the model and result objects. Inspecting, plotting or
    exporting a result should never require indexing into it.
  contents:
  - print.aci
  - print.aci_model
  - summary.aci
  - print.summary.aci
  - as.data.frame.aci
  - plot.aci
  - print.aci_cir
  - summary.aci_cir
  - as.data.frame.aci_cir
  - plot.aci_cir
- title: Package
  contents:
  - aciR-package

articles:
- title: Get started
  navbar: ~
  contents:
  - aciR
- title: Scope and evidence
  navbar: Scope and evidence
