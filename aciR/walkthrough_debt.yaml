# Features the walkthrough had to work around.
#
# Each entry is a place where writing the public walkthrough required a
# detour that a reader of the documentation would not have predicted. They
# are recorded here rather than fixed silently, because each one is a vote
# on what the package should do next, and because a debt only influences the
# roadmap if it is written where an audit can find it.

- helper: integer targeting of ENSO observed channels
  walkthrough: tools/walkthrough/walkthrough.qmd
  missing_feature: >
    aci_conditional() documents that a character `target` is matched against
    the row names of the observation-noise Grammian, but the Grammian built
    by aci_enso_components() carries no dimnames. Character targeting
    therefore fails on the one model where naming the channel matters most,
    with the error "target names no observed component", and the walkthrough
    has to address the channels as 1, 2, 3 and label them by hand. The
    positional call is silently wrong if the channel order ever changes.
  proposed_export: >
    Set dimnames on S_xoS_x, S_yoS_y and the related arrays in
    aci_enso_components() to c("T_C", "T_E", "I"), so that the documented
    character path works for the ENSO model as it does elsewhere. Worth
    auditing aci_predprey_components() and the multivariate constructors for
    the same omission.
  status: open
