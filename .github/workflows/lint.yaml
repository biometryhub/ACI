# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: lint

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: aciR

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: aciR
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        # The committed .lintr admits the paper's equation notation by a narrow
        # rule. Anything it does not admit is an actionable finding, so a new
        # diagnostic fails the job rather than accumulating as noise.
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      # The fixture directories can only be compared where both exist, and
      # `tools/` is excluded from the build, so this cannot live in the test
      # suite: under `R CMD check` it would skip on every run. This job works
      # from the checkout rather than from a tarball, which is the one place
      # the comparison is possible. Hence `working-directory: .`, overriding
      # the job default of `aciR`.
      - name: Fixture provenance
        run: Rscript tools/oracle/check_fixture_provenance.R
        working-directory: .
