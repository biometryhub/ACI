  defect:
    key: fy_gamma_hW_omitted
    source: ENSO_model_cond_ACI_T_C_unobs.m:1053,:1151
    finding: >
      The script's assimilation forcing f_y omits the thermocline term
      gamma_C * h_W.  The same script's simulator drift includes it (:1124),
      h_W is prescribed and observed in this script, and the sibling scripts
      carry the term in the corresponding T_C coefficient rows
      (tau_unobs.m:1138; u_h_W_tau_unobs.m:1016,:1131).  It is a source
      defect, not a convention.
    disposition: >
      acir includes the term by default and reproduces the omission under
      matlab_defect_compat = TRUE.  Both arms are pinned, so the published
      script stays reproducible and the divergence stays measured.
    measured_state_time_phase:
      case_A_whole_record:
        filter_mean_max_abs: 0.060902037
        filter_mean_rmsd: 0.030457663
        aci_total_max_abs: 0.620249643
        aci_total_rmsd: 0.152246551
        integrated_aci_intended: 2.060015
        integrated_aci_literal: 2.601950
        integrated_aci_change: +26.3%
      case_B_14_year_window:
        filter_mean_max_abs: 0.105225129
        filter_mean_rmsd: 0.050660427
        aci_total_max_abs: 2.775189422
        aci_total_rmsd: 0.404750872
        integrated_aci_intended: 13.603754
        integrated_aci_literal: 27.516198
        integrated_aci_change: +102.3%
      covariances: >
        Bit-identical between the two arms on both cases, filter and smoother,
        identical() TRUE and maximum difference exactly 0.
      note: >
        Task P1 measured the same quantities on the MATLAB one-step-ahead
        phase and recorded 0.105150 / 0.0506596 on the filter mean, 2.75317 /
        0.403694 on ACI, and 13.6092 against 27.4482 integrated, +102%.  The
        figures above are the state-time re-measurement of the same defect on
        the shipped convention; they differ from P1's by the phase deltas
        recorded under coefficient_phase and by nothing else.

  validation:
    tolerance_gate: 1.0e-12
    gate_semantics: >
      Maximum absolute error across every graded series of every fixture, at
      every pinned row.  The coefficient fixture is scored the same way over
      its six state-time columns.
    gate_rationale: >
      This is a regression gate on a pinned 15-significant-digit CSV, not a
      claim about accuracy.  The largest per-step quantity pinned is the ACI
      total, which reaches 4.2 on the case B window and is quantised at
      5 * 4.2 * 1e-16 = 2.1e-15 by the file format alone.  The measured
      agreement of this package's public chain against the transcription IN
      MEMORY is 6.33e-15 at worst, so the number gated is a file round trip
      plus one long sequential recursion.  1e-12 is about a hundred times
      above the worst measured value and nine orders below the smallest
      difference that would mean anything, the D1 defect's 0.105 on the filter
      mean.  It is two decades tighter than the four entries above because
      those grade a same-project producer through a coefficient array, while
      these grade a chain against a second author's realisation of the same
      equations and there is no formatting slack to absorb.  It is
      deliberately not tighter: case B is 22000 sequential steps and a
      different BLAS could move the accumulated sums past the floor with no
      code change.
    measured_max_abs_error:
      tc_coefficients_caseA: 1.998401e-15
      tc_outputs_caseA_intended: 5.551115e-15
      tc_outputs_caseA_literal: 7.105427e-15
      tc_outputs_caseB_window_monthly_intended: 6.661338e-15
      tc_outputs_caseB_window_monthly_literal: 5.773160e-15
      tc_outputs_caseB_window_head_intended: 9.325873e-15
      tc_outputs_caseB_window_head_literal: 9.325873e-15
    implementation_agreement:
      compared: >
        acir's public aci(keep = "paths") chain against the independent
        transcription, in one process, on the identical paths and initial
        conditions.  Not inferred from the fixture files.
      max_abs_difference:
        case_A_intended: 2.831069e-15
        case_A_literal: 4.662937e-15
        case_B_intended: 5.329071e-15
        case_B_literal: 6.328271e-15
        filter_and_smoother_moments: at most 1.943e-16 on any case or arm
      reading: >
        The moments agree to a few units in the last place and the divergence
        is concentrated in the ACI metric, which is where a log and a ratio
        are taken.  This is a second author's realisation of the same
        equations, so it IS corroboration and not a regression result; it is
        still not an authors-source grounding.
    test_tally:
      file: tests/testthat/test-29-tc-zeroth-order.R
      expectations_passed: 461
      failures: 0
      errors: 0
      warnings: 0
      skipped: 0
    measured_on: 2026-08-28
    measured_against:
      package: acir
      version: 0.0.0.9000
      built: R 4.5.2

  refresh:
    policy: >
      Same policy as the entries above.  Fixtures are never regenerated in
      place.  Run tools/fixtures/make-tc-fixtures.R into a scratch directory,
      diff the SHA-256 against the values here, and replace the shipped files
      only as a deliberate maintainer step with the new hashes and a NEWS
      entry.  The generator checks the case A signal against its pinned
      SHA-256 before it computes anything.
