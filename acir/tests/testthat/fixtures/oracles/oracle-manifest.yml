# =========================================================================
# acir ANNOTATION (added in W4d).  Everything below this block is the
# original aciR text, unedited.
#
# This manifest is preserved VERBATIM from its aciR origin because it IS the
# hash and provenance authority for the fixtures it lists.  Rewriting it to
# read naturally inside acir would edit the record that the fixtures are
# checked against, so the original wording stands even where it names things
# acir does not have.
#
# One consequence, and the reason for this note: the test paths cited a few
# lines below are aciR's file names.  They do not exist in this package.
# In acir the consuming tests are
#
#   tests/testthat/test-19-compiled-oracles.R
#       stands in for BOTH the `test-oracle-*.R` family and
#       `test-oracle-manifest.R`.  It checks the shipped fixture bytes
#       against the hashes below, and grades the compiled paths against the
#       (signal, reference) pairs.
#
#   tests/testthat/test-28-partition-oracles.R
#       the W3d grading test, and the consumer of the OTHER manifest in this
#       directory, oracle-manifest-partitions.yml.  See the note further
#       down about why the two files are kept apart.
#
# `test-grading-matrix.R` has NO acir equivalent.  acir does not maintain a
# capability grading matrix, so nothing here fails the build when a
# capability is neither graded nor declared ungraded.  Do not read the line
# below as a claim that such a check runs in this package.
#
# Both manifests are parsed by one reader, tests/testthat/helper-oracle-
# manifest.R; test-19 asserts that reader sees every entry of both.
# =========================================================================
#
# Provenance of the independent-oracle fixtures shipped with aciR.
#
# Each fixture pair is (signal, reference). aciR runs its OWN filter, smoother
# and metric on the signal and must reproduce the reference at the sampled
# indices to the stated tolerance. The tests that enforce this are the
# tests/testthat/test-oracle-*.R family, one per fixture group;
# tests/testthat/test-oracle-manifest.R checks the shipped bytes against the
# hashes below, so a changed fixture cannot pass unnoticed, and
# tests/testthat/test-grading-matrix.R fails the build when a capability is
# neither graded nor declared ungraded.
#
# Read `grades` on each entry before citing a fixture as validation. An oracle
# grades the paths its parameters exercise, and no others.
#
# This file does not list every fixture in the directory. The source-derived
# scalar ENSO partitions are pinned by oracle-manifest-partitions.yml and
# graded by tests/testthat/test-28-partition-oracles.R; they are kept apart
# because they are a different evidence class and must never be cited as
# authors-source. test-19 asserts that both manifests are fully pinned and
# that between them they account for every .csv here.

manifest_version: 1

# Provenance of the generation run, not a description of the current package.
# These two travel together and are frozen: they say which version of aciR was
# in the tree on the day these fixtures were produced. Bumping them to follow
# the package version would destroy the only record of when the fixtures were
# made, and the field was renamed from `package_version` after exactly that
# mistake was made and caught.
generated_under_package_version: 0.1.0
generated_on: 2026-07-15

