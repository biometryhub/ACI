# The oracles that depend on no implementation at all. These are the primary
# grounding for the cross-noise path, being algebra on the governing equations,
# solved in closed form in the test file and independent of BOTH aciR and
# MATLAB.
analytic_oracles:
  - id: riccati_fixed_point
    location: tests/testthat/test-identities.R
    statement: >
      The stationary filtered covariance of a constant-coefficient CGNS is the
      positive root of the algebraic Riccati equation
      L_x^2 R^2 - 2 (L_y S_xoS_x - S_yoS_x L_x) R - (S_yoS_y S_xoS_x - S_yoS_x^2) = 0.
      Started at that root with a non-zero S_yoS_x, the recursion must stay
      there to machine precision, since the fixed point of the ODE is exactly
      the fixed point of its Euler map.
    grades: the cross-noise terms in the stationary regime, exactly.
  - id: terminal_identity
    location: tests/testthat/test-identities.R
    statement: >
      The smoother equals the filter at the final index by construction.
    grades: the smoother's terminal boundary condition, exactly.
  - id: online_smoother_zero_lag
    location: tests/testthat/test-online-smoother.R
    statement: >
      The fixed-lag online smoother at lag zero conditions on no observation
      beyond the current step, so it is the forward filter. The recursion adds
      one term per admitted future observation and at lag zero admits none.
    grades: >
      the online smoother's boundary at zero lag, exactly. The measurement on
      2026-08-13 found it identical to the filter, bit for bit, at every step
      size tried.
  - id: online_smoother_triangle
    location: tests/testthat/test-online-smoother.R
    statement: >
      The implementation reconstructs each ordered update product from
      cumulative logarithms rather than forming the reference algorithm's
      O(n^2) triangle. A literal transcription of that triangle is carried in
      the test file and must agree to machine precision.
    grades: >
      the logarithmic reconstruction against the algorithm it replaces. The
      measurements on 2026-08-13 were 2.442e-15 at n = 400 and 5.773e-15 at
      n = 800.
    does_not_grade: >
      the recursion itself, since both sides here share the per-step auxiliary
      quantities. This grades the redesign, not the equations; those are
      graded by the zero-lag identity and the convergence rate below.
  - id: online_smoother_full_lag_order
    location: tests/testthat/test-online-smoother.R
    statement: >
      At full lag the online smoother is the DISCRETE smoother, whereas
      aci_smoother() integrates the CONTINUOUS backward equation. These are
      distinct objects agreeing only as dt tends to zero, so the graded
      quantity is the convergence rate and not equality.
    grades: >
      the full-lag limit at first order. Measured on 2026-08-13 on a fixed
      analytic signal, the gap ratios were 2.017, 2.009, 2.004, 2.002 and
      2.001 across successive halvings of dt, an estimated order of 1.000.
    does_not_grade: >
      agreement at any fixed dt. Asserting equality here would fail by
      construction; the earlier plan for this package wrongly recorded the
      full-lag case as an exact identity, and the refinement study is what
      corrected it.
  - id: zero_information
    location: tests/testthat/test-identities.R
    statement: >
      With no coupling and no noise cross-covariance the observed process is
      independent of the unobserved one, so the metric is zero. The identity is
      exact in continuous time only; under an explicit Euler scheme it vanishes
      at second order in dt, which is what the test asserts.
    grades: the filter/smoother agreement in the no-information limit.

validation:
  tolerance_gate: 1.0e-6
  gate_semantics: >
    Maximum absolute error across all five compared series at the 301 sampled
    indices. The oracle tests run from the installed package fixtures and
    never skip.
  # Measured on the release candidate, not recalled. Both are ~8 orders of
  # magnitude inside the gate. The agreement is at the floating-point noise
  # floor of a 30,001-step recursion, not merely within tolerance.
  observed_max_abs_error:
    dyad: 4.574119e-14
    cross: 1.376677e-14
  measured_on: 2026-07-15

refresh:
  policy: >
    Fixtures are never regenerated in place. Run the harness into a scratch
    directory, diff the SHA-256 against the values above, and replace the
    shipped files only as a deliberate maintainer step with the new hashes and
    a NEWS entry. A fixture whose hash changes without that step is a defect,
    not an update.
